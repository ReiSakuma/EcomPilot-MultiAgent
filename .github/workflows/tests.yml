name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run core regression
        run: >-
          pytest -q
          tests/test_v65_interview_core.py
          tests/test_workflow.py
          tests/test_deepseek_provider.py
          tests/test_v54_market_price_gate.py
          tests/test_v24_tenant_access.py
          tests/test_v8_seller_center_execution.py
          tests/test_listing_review_loop.py
